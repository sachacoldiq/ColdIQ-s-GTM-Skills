name: Validate skill brand safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/validate-brand-safety.test.mjs
      - run: node scripts/validate-brand-safety.mjs
      - run: node --test tests/validate-skills.test.mjs
      - run: node scripts/validate-skills.mjs
